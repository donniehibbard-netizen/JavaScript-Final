<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Movie Search</title>
</head>

<body>
  <nav>
    <div class="logo">
      <img src="./fes-logo.png" alt="FES Logo" class="Logo__img" width="50">
      <div class="logo__title"><Span>Simplified</Span>Flix</div>
    </div>
    <form class="search-form" id="searchForm">
      <div class="search-form__group">
        <input class="search-form__input" type="text" id="searchInput" placeholder="Search movies..." required>
        <button class="search-form__button" type="submit" aria-label="Search">
          <svg class="search-form__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
    </form>
  </nav>
  <main>
    <div class="controls">
      <p id="resultsInfo" class="resultsInfo">
        <span>Showing:</span>
      </p>
      <div>
        <label for="sortSelect">Sort by:</label>
        <select id="sortSelect">
          <option value="Default">Default</option>
          <option value="a-z">A - Z</option>
          <option value="z-a">Z - A</option>
          <option value="Newest">Newest</option>
          <option value="Oldest">Oldest</option>
        </select>
      </div>
    </div>
    <div class="movie-grid" id="movieGrid"></div>
  </main>
  <footer>
    <p>&copy; 2023 Simplified Flix. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
